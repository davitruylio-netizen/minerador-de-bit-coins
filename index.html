<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4e54c8; }
        .form-container { background: #1e1e1e; max-width: 500px; margin: 0 auto 30px; padding: 20px; border-radius: 8px; }
        .form-container input, .form-container button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        .form-container button { background: #4e54c8; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; text-align: center; }
        iframe { border-radius: 6px; border: none; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎮 Central de Jogos Scratch</h1>

    <!-- Form para adicionar jogo -->
    <div class="form-container">
        <h3>Cadastrar Novo Jogo</h3>
        <input type="text" id="title" placeholder="Título do Jogo" required>
        <input type="text" id="scratchId" placeholder="ID do Scratch (ex: 10128407)" required>
        <input type="text" id="category" placeholder="Categoria (ex: Ação)" required>
        <button onclick="cadastrarJogo()">Adicionar Jogo</button>
    </div>

    <!-- Lista de Jogos -->
    <div id="games-container" class="grid"></div>

    <script>
        const API_URL = 'http://localhost:8080/api/games';

        // Buscar e listar jogos
        async function loadGames() {
            try {
                const res = await fetch(API_URL);
                const games = await res.json();
                
                const container = document.getElementById('games-container');
                container.innerHTML = '';

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h2>${game.title}</h2>
                        <p><strong>Categoria:</strong> ${game.category}</p>
                        <iframe 
                            src="https://turbowarp.org/${game.scratchId}/embed" 
                            width="485" 
                            height="402" 
                            allowfullscreen>
                        </iframe>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Erro ao carregar os jogos:", err);
            }
        }

        // Cadastrar novo jogo via POST
        async function cadastrarJogo() {
            const title = document.getElementById('title').value;
            const scratchId = document.getElementById('scratchId').value;
            const category = document.getElementById('category').value;

            if (!title || !scratchId || !category) {
                alert('Preencha todos os campos!');
                return;
            }

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, scratchId, category })
            });

            // Limpar formulário e recarregar lista
            document.getElementById('title').value = '';
            document.getElementById('scratchId').value = '';
            document.getElementById('category').value = '';
            loadGames();
        }

        // Inicializa a listagem ao carregar a página
        loadGames();
    </script>
</body>
</html>
